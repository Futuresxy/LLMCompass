<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="530" viewBox="0 0 1040 530" role="img" aria-label="KV cache 生命周期与 P D 迁移"><title>KV cache 生命周期与 P D 迁移</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b7080"/></marker></defs><rect width="1040" height="530" rx="16" fill="#f5f8fb"/><text x="30" y="39" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" text-anchor="start" fill="#18344c" font-weight="700">状态图｜同一缓存对象可以被多个层引用</text><rect x="35" y="85" width="220" height="112" rx="8" fill="#dcebf9" stroke="#9aafbd"/><text x="145.0" y="115" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" text-anchor="middle" fill="#18344c" font-weight="650">Prefill 阶段图</text><text x="145.0" y="142" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">生成 KV / 索引</text><text x="145.0" y="166" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">确定 owner 与版本</text><rect x="315" y="85" width="255" height="112" rx="8" fill="#d9efea" stroke="#9aafbd"/><text x="442.5" y="115" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" text-anchor="middle" fill="#18344c" font-weight="650">StateObject</text><text x="442.5" y="142" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">数据 / scale / layout</text><text x="442.5" y="166" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">共享引用、位置、寿命</text><rect x="650" y="85" width="355" height="112" rx="8" fill="#dcebf9" stroke="#9aafbd"/><text x="827.5" y="115" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" text-anchor="middle" fill="#18344c" font-weight="650">消费者层</text><text x="827.5" y="142" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">Full / Reindex / Reuse</text><text x="827.5" y="166" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">按状态依赖读取，不重复计容量</text><path d="M255,140L315,140" fill="none" stroke="#5b7080" stroke-width="2" marker-end="url(#arrow)"/><path d="M570,140L650,140" fill="none" stroke="#5b7080" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="280" width="220" height="112" rx="8" fill="#fff0d4" stroke="#9aafbd"/><text x="145.0" y="310" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" text-anchor="middle" fill="#18344c" font-weight="650">源端传输准备</text><text x="145.0" y="337" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">选择块与分片</text><text x="145.0" y="361" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">pack / 重分片 / 元数据</text><rect x="315" y="280" width="255" height="112" rx="8" fill="#fff0d4" stroke="#9aafbd"/><text x="442.5" y="310" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" text-anchor="middle" fill="#18344c" font-weight="650">跨卡／节点传输</text><text x="442.5" y="337" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">send / receive</text><text x="442.5" y="361" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">链路与 HBM 资源竞争</text><rect x="650" y="280" width="355" height="112" rx="8" fill="#d9efea" stroke="#9aafbd"/><text x="827.5" y="310" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" text-anchor="middle" fill="#18344c" font-weight="650">目的端恢复</text><text x="827.5" y="337" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">unpack / 格式转换 / replay</text><text x="827.5" y="361" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">状态 ready 后允许 decode</text><path d="M442,197 L442,235 L145,235 L145,280" fill="none" stroke="#5b7080" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M255,337L315,337" fill="none" stroke="#5b7080" stroke-width="2" marker-end="url(#arrow)"/><path d="M570,337L650,337" fill="none" stroke="#5b7080" stroke-width="2" marker-end="url(#arrow)"/><rect x="315" y="440" width="255" height="64" rx="8" fill="#ffffff" stroke="#9aafbd"/><text x="442.5" y="470" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" text-anchor="middle" fill="#18344c" font-weight="650">持久化 / 卸载</text><path d="M442,392 L442,440" fill="none" stroke="#5b7080" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M570,472 L828,472 L828,392" fill="none" stroke="#5b7080" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="40" y="480" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" text-anchor="start" fill="#5b7080" font-weight="400">可选路径</text></svg>
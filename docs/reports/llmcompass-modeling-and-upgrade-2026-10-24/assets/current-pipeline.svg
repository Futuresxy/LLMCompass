<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="490" viewBox="0 0 1040 490" role="img" aria-label="现有 LLMCompass 的预测链路"><title>现有 LLMCompass 的预测链路</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b7080"/></marker></defs><rect width="1040" height="490" rx="16" fill="#f5f8fb"/><text x="30" y="38" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" text-anchor="start" fill="#18344c" font-weight="700">现有机制｜从形状与硬件参数到预测</text><rect x="35" y="70" width="290" height="106" rx="8" fill="#dcebf9" stroke="#9aafbd"/><text x="180.0" y="100" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" text-anchor="middle" fill="#18344c" font-weight="650">LLM 描述</text><text x="180.0" y="127" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">B / S / hidden / heads / TP</text><text x="180.0" y="151" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">Tensor 只保存形状与 dtype</text><rect x="365" y="70" width="290" height="106" rx="8" fill="#dcebf9" stroke="#9aafbd"/><text x="510.0" y="100" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" text-anchor="middle" fill="#18344c" font-weight="650">算子工作量</text><text x="510.0" y="127" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">GEMM 的 M / N / K</text><text x="510.0" y="151" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">向量、归约与通信尺寸</text><rect x="705" y="70" width="300" height="106" rx="8" fill="#d9efea" stroke="#9aafbd"/><text x="855.0" y="100" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" text-anchor="middle" fill="#18344c" font-
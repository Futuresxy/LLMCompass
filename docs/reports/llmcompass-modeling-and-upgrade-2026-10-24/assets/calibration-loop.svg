<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="450" viewBox="0 0 1040 450" role="img" aria-label="校准和独立验证的闭环"><title>校准和独立验证的闭环</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b7080"/></marker></defs><rect width="1040" height="450" rx="16" fill="#f5f8fb"/><text x="30" y="39" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" text-anchor="start" fill="#18344c" font-weight="700">校准闭环｜先资源、再 kernel、再独立验证</text><rect x="35" y="85" width="280" height="112" rx="8" fill="#dcebf9" stroke="#9aafbd"/><text x="175.0" y="115" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" text-anchor="middle" fill="#18344c" font-weight="650">资源微基准</text><text x="175.0" y="142" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">依赖链 / 独立操作 / 搬运</text><text x="175.0" y="166" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">隔离带宽、吞吐与同步</text><rect x="380" y="85" width="280" height="112" rx="8" fill="#d9efea" stroke="#9aafbd"/><text x="520.0" y="115" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" text-anchor="middle" fill="#18344c" font-weight="650">机制参数</text><text x="520.0" y="142" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">有效带宽 / latency / issue</text><text x="520.0" y="166" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">区间、版本、置信范围</text><rect x="725" y="85" width="280" height="112" rx="8" fill="#fff0d4" stroke="#9aafbd"/><text x="865.0" y="115" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" text-anchor="middle" fill="#18344c" font-weight="650">kernel 校准集</text><text x="865.0" y="142" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">tile / stage / 融合 / 并发</text><text x="865.0" y="166" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">检验资源组合与映射</text><path d="M315,140L380,140" fill="none" stroke="#5b7080" stroke-width="2" marker-end="url(#arrow)"/><path d="M660,140L725,140" fill="none" stroke="#5b7080" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="285" width="280" height="112" rx="8" fill="#dcebf9" stroke="#9aafbd"/><text x="175.0" y="315" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" text-anchor="middle" fill="#18344c" font-weight="650">留出验证集</text><text x="175.0" y="342" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">新 shape / 长上下文 / 新策略</text><text x="175.0" y="366" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">同轮不参与调参</text><rect x="380" y="285" width="280" height="112" rx="8" fill="#d9efea" stroke="#9aafbd"/><text x="520.0" y="315" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" text-anchor="middle" fill="#18344c" font-weight="650">误差与归因</text><text x="520.0" y="342" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">中位 / P90 / 绝对误差</text><text x="520.0" y="366" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">瓶颈、排序与时间线</text><rect x="725" y="285" width="280" height="112" rx="8" fill="#fff0d4" stroke="#9aafbd"/><text x="865.0" y="315" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" text-anchor="middle" fill="#18344c" font-weight="650">版本化修订</text><text x="865.0" y="342" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">识别机制缺口后再迭代</text><text x="865.0" y="366" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" text-anchor="middle" fill="#5b7080" font-weight="400">保留上一版本与验证结果</text><path d="M865,197 L865,240 L175,240 L175,285" fill="none" stroke="#5b7080" stroke-width="2" marker-end="url(#arrow)"/><path d="M315,340L380,340" fill="none" stroke="#5b7080" stroke-width="2" marker-end="url(#arrow)"/><path d="M660,340L725,340" fill="none" stroke="#5b7080" stroke-width="2" marker-end="url(#arrow)"/></svg>